name: AI classification quality
description: Report a reproducible classification or provider-compatibility issue.
title: "[Classification]: "
labels: [ai-classification, triage]
body:
  - type: input
    id: goal
    attributes:
      label: Natural-language goal
      description: Use a synthetic, non-sensitive goal.
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: Provider type and model
      placeholder: OpenAI-compatible local endpoint, model-name
    validations:
      required: true

  - type: textarea
    id: fixture
    attributes:
      label: Minimal synthetic fixture
      description: Include only the few original questions required to reproduce the result.
    validations:
      required: true

  - type: textarea
    id: result
    attributes:
      label: Expected and actual candidate
      description: Include question IDs, batch count, validation code, and redacted messages when useful.
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Data-safety confirmation
      options:
        - label: I did not include a key, authorization header, provider response containing user data, or private question bank.
          required: true
        - label: The fixture is original, synthetic, public-domain, or compatibly licensed.
          required: true
