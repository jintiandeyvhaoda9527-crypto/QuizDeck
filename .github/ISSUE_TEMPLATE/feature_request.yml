name: Feature request
description: Propose a focused improvement to learning, classification, privacy, or maintenance.
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the enterprise training or maintainer problem, not only the proposed UI.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the smallest useful behavior and its offline fallback.
    validations:
      required: true

  - type: textarea
    id: privacy
    attributes:
      label: Privacy and deployment impact
      description: Note new data, storage, permissions, model requests, endpoints, or administrative requirements.
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This proposal does not require embedding a provider credential in the app.
          required: true
        - label: The example contains no private organizational or employee data.
          required: true
