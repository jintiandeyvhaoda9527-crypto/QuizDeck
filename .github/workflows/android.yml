name: Android

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "android/**"
      - "app/**"
      - "mobile/**"
      - "public/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.mobile.config.ts"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - locale: zh-CN
            task: assembleZhDebug
            apk: android/app/build/outputs/apk/zh/debug/app-zh-debug.apk
          - locale: en-US
            task: assembleEnDebug
            apk: android/app/build/outputs/apk/en/debug/app-en-debug.apk
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Android assets
        run: pnpm run android:sync

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android :app:${{ matrix.task }} --no-daemon

      - name: Upload test APK
        uses: actions/upload-artifact@v7
        with:
          name: quizdeck-${{ matrix.locale }}-debug-${{ github.sha }}
          path: ${{ matrix.apk }}
          if-no-files-found: error
          retention-days: 14
